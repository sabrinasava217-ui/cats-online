name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Jalur HP: jika repo hanya berisi cats-online.zip, ekstrak dulu
      - name: Ekstrak cats-online.zip (jika ada)
        run: |
          if [ -f cats-online.zip ] && [ ! -f package.json ]; then
            unzip -o cats-online.zip
          fi
          ls

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependency
        run: npm install

      - name: Salin library ke www
        run: npm run prepare-web

      - name: Tambah platform Android
        run: npx cap add android

      - name: Konfigurasi Android (landscape, fullscreen, ikon, nama)
        run: node scripts/configure-android.js

      - name: Sync web ke Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Ganti nama APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CATS-ONLINE.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CATS-ONLINE-apk
          path: CATS-ONLINE.apk
          retention-days: 30
